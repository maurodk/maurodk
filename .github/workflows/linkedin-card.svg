<svg width="360" height="104" viewBox="0 0 360 104" fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    .label {
      fill: #8B949E;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .title {
      fill: #F0F6FC;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .handle {
      fill: #58A6FF;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
    }

    .arrow {
      fill: #8B949E;
      font-family: Arial, sans-serif;
      font-size: 17px;
    }
  </style>

  <!-- card -->
  <rect
    x="0.5"
    y="0.5"
    width="359"
    height="103"
    rx="16"
    fill="#0D1117"
    stroke="#30363D"
  />

  <!-- accent -->
  <rect
    x="18"
    y="25"
    width="2"
    height="54"
    rx="1"
    fill="#58A6FF"
  />

  <!-- icon -->
  <rect
    x="34"
    y="27"
    width="48"
    height="48"
    rx="12"
    fill="#161B22"
    stroke="#30363D"
  />

  <text
    x="58"
    y="60"
    text-anchor="middle"
    fill="#F0F6FC"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="700"
  >in</text>

  <!-- content -->
  <text x="102" y="37" class="label">PROFESSIONAL</text>

  <text x="102" y="58" class="title">LINKEDIN</text>

  <text x="102" y="77" class="handle">/in/omaurojr</text>

  <!-- arrow -->
  <text
    x="325"
    y="59"
    text-anchor="middle"
    class="arrow"
  >↗</text>

</svg>
