<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F1F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#33D1FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>

    <filter id="blurXL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="nameReveal">
      <rect x="88" y="70" width="0" height="64" rx="8">
        <animate attributeName="width" from="0" to="620" dur="1.1s" begin="0s" fill="freeze" />
      </rect>
    </clipPath>

    <style>
      .bg { fill: url(#bg); }
      .frame {
        fill: rgba(255,255,255,0.025);
        stroke: rgba(255,255,255,0.08);
        stroke-width: 1.2;
      }
      .grid {
        stroke: rgba(148,163,184,0.08);
        stroke-width: 1;
      }
      .corner {
        stroke: rgba(51,209,255,0.35);
        stroke-width: 1.5;
      }
      .eyebrow {
        fill: #7DD3FC;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        letter-spacing: 0.22em;
        opacity: 0;
        animation: fadeUp 0.6s ease-out 0.25s forwards;
      }
      .nameShadow {
        fill: #8B5CF6;
        opacity: 0.16;
        filter: url(#softGlow);
      }
      .name {
        fill: #F8FAFC;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 0.14em;
        opacity: 0;
        animation: fadeUp 0.55s ease-out 0.18s forwards;
      }
      .divider {
        fill: url(#accent);
        transform: scaleX(0);
        transform-origin: left center;
        animation: growLine 0.7s ease-out 0.65s forwards;
      }
      .subtitle {
        fill: #B6C2D3;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        opacity: 0;
        animation: fadeUp 0.7s ease-out 0.95s forwards;
      }

      .roleWrap { opacity: 0; animation-delay: 1.15s; animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .roleMain {
        fill: #E5ECF5;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .ghostCyan {
        fill: #33D1FF;
        opacity: 0;
      }
      .ghostPink {
        fill: #FF4FD8;
        opacity: 0;
      }

      .role1 { animation-name: role1; }
      .role2 { animation-name: role2; }
      .role3 { animation-name: role3; }
      .role4 { animation-name: role4; }

      .role1 .ghostCyan { animation: ghost1c 16s linear infinite 1.15s; }
      .role1 .ghostPink { animation: ghost1p 16s linear infinite 1.15s; }

      .role2 .ghostCyan { animation: ghost2c 16s linear infinite 1.15s; }
      .role2 .ghostPink { animation: ghost2p 16s linear infinite 1.15s; }

      .role3 .ghostCyan { animation: ghost3c 16s linear infinite 1.15s; }
      .role3 .ghostPink { animation: ghost3p 16s linear infinite 1.15s; }

      .role4 .ghostCyan { animation: ghost4c 16s linear infinite 1.15s; }
      .role4 .ghostPink { animation: ghost4p 16s linear infinite 1.15s; }

      .status {
        fill: #7F8EA3;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        letter-spacing: 0.08em;
        opacity: 0;
        animation: fadeUp 0.65s ease-out 1.2s forwards;
      }
      .cursor {
        fill: #8B5CF6;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 16px;
        font-weight: 700;
        opacity: 0;
        animation:
          fadeUp 0.65s ease-out 1.2s forwards,
          blink 1s step-end infinite 1.85s;
      }

      .blobA {
        fill: #33D1FF;
        opacity: 0.10;
        filter: url(#blurXL);
      }
      .blobB {
        fill: #8B5CF6;
        opacity: 0.12;
        filter: url(#blurXL);
      }
      .blobC {
        fill: #FF4FD8;
        opacity: 0.08;
        filter: url(#blurXL);
      }

      .scan {
        fill: url(#accent);
        opacity: 0.06;
        animation: scan 4s linear infinite;
      }

      .card {
        fill: rgba(255,255,255,0.04);
        stroke: rgba(255,255,255,0.09);
        stroke-width: 1;
      }
      .cardTitle {
        fill: #D8E2F0;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        letter-spacing: 0.18em;
      }
      .pill {
        fill: rgba(255,255,255,0.06);
        stroke: rgba(255,255,255,0.08);
        stroke-width: 1;
      }
      .pillText {
        fill: #DDE7F4;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes growLine {
        from { transform: scaleX(0); opacity: 0.3; }
        to   { transform: scaleX(1); opacity: 1; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes scan {
        0%   { transform: translateX(-220px); }
        100% { transform: translateX(1320px); }
      }

      @keyframes role1 {
        0%, 17%   { opacity: 1; }
        21%, 100% { opacity: 0; }
      }
      @keyframes role2 {
        0%, 24%   { opacity: 0; }
        28%, 45%  { opacity: 1; }
        49%, 100% { opacity: 0; }
      }
      @keyframes role3 {
        0%, 52%   { opacity: 0; }
        56%, 73%  { opacity: 1; }
        77%, 100% { opacity: 0; }
      }
      @keyframes role4 {
        0%, 80%   { opacity: 0; }
        84%, 97%  { opacity: 1; }
        100%      { opacity: 0; }
      }

      /* ghost glitch only during transition moments */
      @keyframes ghost1c {
        0%, 1%   { opacity: 0; transform: translate(0,0); }
        2%       { opacity: .55; transform: translate(-3px,0); }
        3%       { opacity: .12; transform: translate(2px,0); }
        4%, 15%  { opacity: 0; transform: translate(0,0); }
        16%      { opacity: .45; transform: translate(2px,0); }
        17%      { opacity: .10; transform: translate(-2px,0); }
        18%,100% { opacity: 0; transform: translate(0,0); }
      }
      @keyframes ghost1p {
        0%, 1%   { opacity: 0; transform: translate(0,0); }
        2%       { opacity: .35; transform: translate(3px,0); }
        3%       { opacity: .10; transform: translate(-2px,0); }
        4%, 15%  { opacity: 0; transform: translate(0,0); }
        16%      { opacity: .25; transform: translate(-2px,0); }
        17%      { opacity: .08; transform: translate(2px,0); }
        18%,100% { opacity: 0; transform: translate(0,0); }
      }

      @keyframes ghost2c {
        0%, 26%  { opacity: 0; transform: translate(0,0); }
        27%      { opacity: .55; transform: translate(-3px,0); }
        28%      { opacity: .12; transform: translate(2px,0); }
        29%, 43% { opacity: 0; transform: translate(0,0); }
        44%      { opacity: .45; transform: translate(2px,0); }
        45%      { opacity: .10; transform: translate(-2px,0); }
        46%,100% { opacity: 0; transform: translate(0,0); }
      }
      @keyframes ghost2p {
        0%, 26%  { opacity: 0; transform: translate(0,0); }
        27%      { opacity: .35; transform: translate(3px,0); }
        28%      { opacity: .10; transform: translate(-2px,0); }
        29%, 43% { opacity: 0; transform: translate(0,0); }
        44%      { opacity: .25; transform: translate(-2px,0); }
        45%      { opacity: .08; transform: translate(2px,0); }
        46%,100% { opacity: 0; transform: translate(0,0); }
      }

      @keyframes ghost3c {
        0%, 54%  { opacity: 0; transform: translate(0,0); }
        55%      { opacity: .55; transform: translate(-3px,0); }
        56%      { opacity: .12; transform: translate(2px,0); }
        57%, 71% { opacity: 0; transform: translate(0,0); }
        72%      { opacity: .45; transform: translate(2px,0); }
        73%      { opacity: .10; transform: translate(-2px,0); }
        74%,100% { opacity: 0; transform: translate(0,0); }
      }
      @keyframes ghost3p {
        0%, 54%  { opacity: 0; transform: translate(0,0); }
        55%      { opacity: .35; transform: translate(3px,0); }
        56%      { opacity: .10; transform: translate(-2px,0); }
        57%, 71% { opacity: 0; transform: translate(0,0); }
        72%      { opacity: .25; transform: translate(-2px,0); }
        73%      { opacity: .08; transform: translate(2px,0); }
        74%,100% { opacity: 0; transform: translate(0,0); }
      }

      @keyframes ghost4c {
        0%, 82%  { opacity: 0; transform: translate(0,0); }
        83%      { opacity: .55; transform: translate(-3px,0); }
        84%      { opacity: .12; transform: translate(2px,0); }
        85%, 95% { opacity: 0; transform: translate(0,0); }
        96%      { opacity: .45; transform: translate(2px,0); }
        97%      { opacity: .10; transform: translate(-2px,0); }
        98%,100% { opacity: 0; transform: translate(0,0); }
      }
      @keyframes ghost4p {
        0%, 82%  { opacity: 0; transform: translate(0,0); }
        83%      { opacity: .35; transform: translate(3px,0); }
        84%      { opacity: .10; transform: translate(-2px,0); }
        85%, 95% { opacity: 0; transform: translate(0,0); }
        96%      { opacity: .25; transform: translate(-2px,0); }
        97%      { opacity: .08; transform: translate(2px,0); }
        98%,100% { opacity: 0; transform: translate(0,0); }
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="360" rx="28"/>

  <!-- background blobs -->
  <circle class="blobA" cx="1040" cy="92" r="110"/>
  <circle class="blobB" cx="1120" cy="220" r="95"/>
  <circle class="blobC" cx="935" cy="260" r="72"/>

  <!-- subtle frame -->
  <rect class="frame" x="18" y="18" width="1244" height="324" rx="22"/>

  <!-- grid -->
  <line class="grid" x1="0" y1="90" x2="1280" y2="90"/>
  <line class="grid" x1="0" y1="180" x2="1280" y2="180"/>
  <line class="grid" x1="0" y1="270" x2="1280" y2="270"/>
  <line class="grid" x1="320" y1="0" x2="320" y2="360"/>
  <line class="grid" x1="640" y1="0" x2="640" y2="360"/>
  <line class="grid" x1="960" y1="0" x2="960" y2="360"/>

  <!-- decorative corners -->
  <path class="corner" d="M40 40 H90 M40 40 V90"/>
  <path class="corner" d="M1240 40 H1190 M1240 40 V90"/>
  <path class="corner" d="M40 320 H90 M40 320 V270"/>
  <path class="corner" d="M1240 320 H1190 M1240 320 V270"/>

  <!-- scan -->
  <rect class="scan" x="-220" y="0" width="190" height="360"/>

  <!-- left content -->
  <text x="88" y="62" class="eyebrow">OMAURODK // GITHUB PROFILE</text>

  <g clip-path="url(#nameReveal)">
    <text x="88" y="112" class="nameShadow">CARLOS MAURICIO</text>
    <text x="88" y="112" class="name">CARLOS MAURICIO</text>
  </g>

  <rect x="88" y="132" width="560" height="4" rx="2" class="divider"/>

  <text x="88" y="164" class="subtitle">PRODUCT ENGINEER PLENO // FULLSTACK // ARCHITECTURE // AI-FIRST</text>

  <!-- rotating roles -->
  <g transform="translate(88 236)">
    <g class="roleWrap role1">
      <text class="roleMain" x="0" y="0">PRODUCT ENGINEER PLENO</text>
      <text class="roleMain ghostCyan" x="0" y="0">PRODUCT ENGINEER PLENO</text>
      <text class="roleMain ghostPink" x="0" y="0">PRODUCT ENGINEER PLENO</text>
    </g>

    <g class="roleWrap role2">
      <text class="roleMain" x="0" y="0">FULLSTACK DEVELOPER PLENO</text>
      <text class="roleMain ghostCyan" x="0" y="0">FULLSTACK DEVELOPER PLENO</text>
      <text class="roleMain ghostPink" x="0" y="0">FULLSTACK DEVELOPER PLENO</text>
    </g>

    <g class="roleWrap role3">
      <text class="roleMain" x="0" y="0">SOFTWARE ARCHITECT</text>
      <text class="roleMain ghostCyan" x="0" y="0">SOFTWARE ARCHITECT</text>
      <text class="roleMain ghostPink" x="0" y="0">SOFTWARE ARCHITECT</text>
    </g>

    <g class="roleWrap role4">
      <text class="roleMain" x="0" y="0">AI-FIRST BUILDER</text>
      <text class="roleMain ghostCyan" x="0" y="0">AI-FIRST BUILDER</text>
      <text class="roleMain ghostPink" x="0" y="0">AI-FIRST BUILDER</text>
    </g>
  </g>

  <text x="88" y="304" class="status">status: building, architecting and shipping</text>
  <text x="470" y="304" class="cursor">_</text>
</svg>
